<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORSAP — Administration</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #d3121a;
      --primary-hover: #b00f15;
      --dark: #14171a;
      --dark-card: #1f2429;
      --surface: #ffffff;
      --bg: #f5f6f8;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --radius: 10px;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 10px 30px -4px rgba(15, 23, 42, 0.08);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    
    /* Header */
    .header { background: var(--dark); color: #fff; padding: 24px 36px; border-bottom: 3px solid var(--primary); box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .header-inner { max-width: 1360px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
    .brand-group { display: flex; align-items: center; gap: 16px; }
    .brand-group img { height: 46px; width: 46px; border-radius: 8px; object-fit: contain; background: #fff; padding: 3px; }
    .brand-title h1 { font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; color: #fff; }
    .brand-title p { font-size: 12.5px; color: rgba(255,255,255,0.6); margin-top: 2px; }
    
    .nav-tabs { display: flex; gap: 8px; margin-top: 18px; max-width: 1360px; margin-left: auto; margin-right: auto; }
    .tab-btn { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.1); padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; border-radius: 8px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .tab-btn:hover { background: rgba(255,255,255,0.12); color: #fff; transform: translateY(-1px); }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(211,18,26,0.35); }
    .tab-badge { background: rgba(0,0,0,0.25); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
    
    .logout-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(211, 18, 26, 0.15); border: 1px solid rgba(211, 18, 26, 0.4); color: #ff8a8f; padding: 8px 16px; border-radius: 6px; font-size: 12px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; text-decoration: none; transition: all 0.2s; }
    .logout-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Layout Wrap */
    .wrap { max-width: 1360px; margin: 0 auto; padding: 32px 24px; }
    
    /* Section Cards */
    .editor-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; margin-bottom: 36px; box-shadow: var(--shadow); transition: box-shadow 0.2s; position: relative; overflow: hidden; }
    .editor-section::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), #f97316); }
    .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
    .editor-header h2 { font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; color: var(--dark); display: flex; align-items: center; gap: 10px; }
    .editor-header h2 .mode-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
    
    .form-grid { display: grid; grid-cols-1; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 7px; }
    .form-group label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    .form-group input[type="text"], .form-group textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-family: inherit; font-size: 14px; color: var(--text); background: #fdfdfd; transition: all 0.2s; outline: none; }
    .form-group input[type="text"]:focus, .form-group textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(211, 18, 26, 0.1); }
    .form-group textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
    
    /* Upload Dropzones */
    .dropzone { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; background: #fafbfc; text-align: center; cursor: pointer; transition: all 0.2s; }
    .dropzone:hover { border-color: var(--primary); background: #fffafb; }
    .dropzone input[type="file"] { display: none; }
    .dropzone-label { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
    .dropzone-icon { width: 32px; height: 32px; color: var(--text-muted); }
    .dropzone-text { font-size: 13.5px; font-weight: 600; color: var(--dark); }
    .dropzone-hint { font-size: 11.5px; color: var(--text-muted); }

    /* Previews */
    .preview-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-top: 12px; }
    .preview-thumb { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); background: #fff; }
    .preview-info { flex: 1; min-width: 0; }
    .preview-title { font-size: 13px; font-weight: 700; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview-badge { display: inline-block; font-size: 10.5px; font-weight: 600; color: #16a34a; background: #dcfce7; padding: 2px 6px; border-radius: 4px; margin-top: 4px; }
    
    /* Buttons */
    .btn-group { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    .submit-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--primary); color: #fff; border: none; padding: 13px 28px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border-radius: 6px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(211,18,26,0.3); }
    .submit-btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(211,18,26,0.4); }
    
    .cancel-btn { display: inline-flex; align-items: center; gap: 6px; background: #f1f5f9; color: var(--text-muted); border: 1px solid var(--border); padding: 12px 20px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    .cancel-btn:hover { background: #e2e8f0; color: var(--dark); }
    
    .remove-btn { background: none; border: 1px solid #fee2e2; color: #dc2626; padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    .remove-btn:hover { background: #fee2e2; }

    /* Tables */
    .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 40px; }
    .table-header-title { padding: 20px 24px; font-family: 'Archivo', sans-serif; font-size: 16px; font-weight: 800; color: var(--dark); border-bottom: 1px solid var(--border); background: #fcfcfd; display: flex; justify-content: space-between; align-items: center; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f8fafc; color: var(--text-muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    td { padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }
    
    /* Action Buttons in Table */
    .actions-cell { display: flex; align-items: center; gap: 8px; }
    .view-link { display: inline-flex; align-items: center; gap: 4px; background: #f1f5f9; color: var(--dark); padding: 6px 12px; font-size: 12px; font-weight: 600; text-decoration: none; border-radius: 4px; border: 1px solid var(--border); transition: all 0.15s; }
    .view-link:hover { background: #e2e8f0; color: var(--primary); }
    .edit-btn { display: inline-flex; align-items: center; gap: 4px; background: #1e293b; border: 1px solid #1e293b; color: #fff; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; border-radius: 4px; }
    .edit-btn:hover { background: var(--primary); border-color: var(--primary); }
    .del-btn { display: inline-flex; align-items: center; gap: 4px; background: transparent; border: 1px solid #fca5a5; color: #dc2626; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; border-radius: 4px; }
    .del-btn:hover { background: #dc2626; color: #fff; border-color: #dc2626; }
    
    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge.pro { background: #fee2e2; color: #991b1b; }
    .badge.perso { background: #e2e8f0; color: #334155; }
    .date-badge { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-muted); }
    
    .msg { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); }
    .empty { text-align: center; padding: 60px 24px; color: var(--text-muted); font-size: 14.5px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <div class="brand-group">
        <img src="/admin/logo.jpg" alt="ORSAP Logo" />
        <div class="brand-title">
          <h1>ORSAP — Administration</h1>
          <p>Panneau de contrôle &amp; Gestion de contenu</p>
        </div>
      </div>
      <div>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
          {{DB_STATUS_BADGE}}
          <a href="/admin/logout" class="logout-btn">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
            Déconnexion
          </a>
        </div>
      </div>
    </div>
    
    <div class="nav-tabs">
      <a href="/admin?tab=devis" class="tab-btn {{TAB_DEVIS_ACTIVE}}">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
        Demandes de devis
        <span class="tab-badge">{{SUBMISSIONS_COUNT}}</span>
      </a>
      <a href="/admin?tab=recrutement" class="tab-btn {{TAB_RECRUTEMENT_ACTIVE}}">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        Recrutement
        <span class="tab-badge">{{APPLICATIONS_COUNT}}</span>
      </a>
      <a href="/admin?tab=blog" class="tab-btn {{TAB_BLOG_ACTIVE}}">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" /></svg>
        Gestion du Blog &amp; Documents
        <span class="tab-badge">{{BLOGS_COUNT}}</span>
      </a>
      <a href="/admin?tab=subscribers" class="tab-btn {{TAB_SUBSCRIBERS_ACTIVE}}">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
        Liste Clients &amp; Abonnés
        <span class="tab-badge">{{SUBSCRIBERS_COUNT}}</span>
      </a>
    </div>
  </div>

  {{TAB_CONTENT}}

  <script>
    // Blog State
    let base64Image = null;
    let base64Pdf = null;
    let pdfFileName = null;
    let editingBlogId = null;
    
    function previewPdf(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      pdfFileName = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Pdf = e.target.result;
        const nameEl = document.getElementById("pdfName");
        nameEl.textContent = pdfFileName;
        const previewCard = document.getElementById("pdfPreviewCard");
        if (previewCard) previewCard.style.display = "flex";
      };
      reader.readAsDataURL(file);
    }

    function removePdf() {
      base64Pdf = null;
      pdfFileName = null;
      const pdfInput = document.getElementById("blogPdf");
      if (pdfInput) pdfInput.value = "";
      const previewCard = document.getElementById("pdfPreviewCard");
      if (previewCard) previewCard.style.display = "none";
    }
    
    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result;
        const preview = document.getElementById("imagePreview");
        preview.src = base64Image;
        const previewCard = document.getElementById("imgPreviewCard");
        if (previewCard) previewCard.style.display = "flex";
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      base64Image = null;
      const imgInput = document.getElementById("blogImage");
      if (imgInput) imgInput.value = "";
      const preview = document.getElementById("imagePreview");
      if (preview) { preview.src = ""; }
      const previewCard = document.getElementById("imgPreviewCard");
      if (previewCard) previewCard.style.display = "none";
    }

    // Delete devis
    async function deleteEntry(id) {
      if (!confirm("Supprimer cette demande ?")) return;
      const res = await fetch("/api/devis/" + id, { method: "DELETE" });
      if (res.ok) {
        const row = document.getElementById("row-" + id);
        if (row) row.remove();
        location.reload();
      } else {
        alert("Erreur lors de la suppression.");
      }
    }

    // Delete application
    async function deleteApp(id) {
      if (!confirm("Supprimer cette candidature ?")) return;
      const res = await fetch("/api/recrutement/" + id, { method: "DELETE" });
      if (res.ok) {
        const row = document.getElementById("app-" + id);
        if (row) row.remove();
        location.reload();
      } else {
        alert("Erreur lors de la suppression.");
      }
    }

    // Delete subscriber
    async function deleteSubscriber(id) {
      if (!confirm("Supprimer cet abonné de la liste clients ?")) return;
      const res = await fetch("/api/newsletter/" + id, { method: "DELETE" });
      if (res.ok) {
        const row = document.getElementById("sub-" + id);
        if (row) row.remove();
        location.reload();
      } else {
        alert("Erreur lors de la suppression.");
      }
    }

    // Edit blog post
    async function editBlog(id) {
      try {
        const res = await fetch("/api/blogs/" + id);
        if (!res.ok) throw new Error("Impossible de charger les détails de l'article.");
        const blog = await res.json();

        editingBlogId = blog.id;
        document.getElementById("formTitle").innerHTML = '<span class="mode-indicator" style="background:#f59e0b;"></span> Mode Modification : ' + (blog.title || "");
        document.getElementById("blogTitle").value = blog.title || "";
        document.getElementById("blogSummary").value = blog.summary || "";
        document.getElementById("blogContent").value = blog.content || "";

        // Image state
        base64Image = blog.image || null;
        const preview = document.getElementById("imagePreview");
        const imgCard = document.getElementById("imgPreviewCard");
        if (blog.image) {
          preview.src = blog.image;
          if (imgCard) imgCard.style.display = "flex";
        } else {
          if (imgCard) imgCard.style.display = "none";
        }

        // PDF state
        base64Pdf = blog.pdf || null;
        pdfFileName = blog.pdfName || null;
        const pdfEl = document.getElementById("pdfName");
        const pdfCard = document.getElementById("pdfPreviewCard");
        if (blog.pdf || blog.pdfName) {
          pdfEl.textContent = blog.pdfName || "Document joint existant (conservé)";
          if (pdfCard) pdfCard.style.display = "flex";
        } else {
          if (pdfCard) pdfCard.style.display = "none";
        }

        document.getElementById("submitBtn").innerHTML = '<svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg> Enregistrer les modifications';
        document.getElementById("cancelBtn").style.display = "inline-flex";

        const section = document.querySelector(".editor-section");
        if (section) section.scrollIntoView({ behavior: "smooth" });
      } catch (err) {
        alert(err.message || "Erreur lors du chargement de l'article.");
      }
    }

    // Cancel edit mode
    function cancelEdit() {
      editingBlogId = null;
      document.getElementById("formTitle").innerHTML = '<span class="mode-indicator"></span> Rédiger un nouvel article de blog';
      document.getElementById("blogForm").reset();
      base64Image = null;
      base64Pdf = null;
      pdfFileName = null;
      const imgCard = document.getElementById("imgPreviewCard");
      if (imgCard) imgCard.style.display = "none";
      const pdfCard = document.getElementById("pdfPreviewCard");
      if (pdfCard) pdfCard.style.display = "none";
      document.getElementById("submitBtn").innerHTML = '<svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg> Publier l\'article';
      document.getElementById("cancelBtn").style.display = "none";
    }

    // Create or Update blog
    async function handleBlogSubmit(event) {
      event.preventDefault();
      const title = document.getElementById("blogTitle").value;
      const summary = document.getElementById("blogSummary").value;
      const content = document.getElementById("blogContent").value;

      const url = editingBlogId ? "/api/blogs/" + editingBlogId : "/api/blogs";
      const method = editingBlogId ? "PUT" : "POST";

      const res = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title,
          summary,
          content,
          image: base64Image,
          pdf: base64Pdf,
          pdfName: pdfFileName
        })
      });

      if (res.ok) {
        alert(editingBlogId ? "Article modifié avec succès !" : "Article publié avec succès !");
        location.reload();
      } else {
        const data = await res.json();
        alert(data.error || "Erreur lors de l'enregistrement.");
      }
    }

    const createBlog = handleBlogSubmit;

    // Import & Restore blogs
    async function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (!confirm("Restaurer les articles depuis \"" + file.name + "\" ? Vos articles existants seront préservés et fusionnés.")) {
        event.target.value = "";
        return;
      }
      try {
        const text = await file.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          alert("Erreur de format : Le fichier \"" + file.name + "\" ne contient pas un format JSON valide.\n(" + parseErr.message + ")");
          return;
        }

        const res = await fetch("/api/admin/import/blogs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(json)
        });

        if (res.ok) {
          const data = await res.json().catch(() => ({ count: "plusieurs" }));
          alert("Sauvegarde restaurée avec succès ! Total d'articles actifs : " + (data.count || "OK"));
          location.reload();
        } else {
          let errorMsg = "Erreur HTTP " + res.status;
          try {
            const data = await res.json();
            if (data && data.error) errorMsg = data.error;
          } catch {
            const rawText = await res.text().catch(() => "");
            if (rawText) errorMsg = rawText.slice(0, 200);
          }
          alert("Échec de l'importation : " + errorMsg);
        }
      } catch (err) {
        alert("Une erreur inattendue est survenue : " + err.message);
      } finally {
        event.target.value = "";
      }
    }

    // Delete blog
    async function deleteBlog(id) {
      if (!confirm("Supprimer cet article de blog définitivement ?")) return;
      const res = await fetch("/api/blogs/" + id, { method: "DELETE" });
      if (res.ok) {
        const row = document.getElementById("blog-" + id);
        if (row) row.remove();
        location.reload();
      } else {
        alert("Erreur lors de la suppression.");
      }
    }

    // Auto-sync alert on JSON download
    function onDownloadExport() {
      setTimeout(async () => {
        try {
          const res = await fetch("/api/admin/sync/github", { method: "POST" });
          const data = await res.json();
          if (data.success) {
            console.log("Auto-synced to GitHub on export:", data);
          }
        } catch (e) {}
      }, 500);
    }

    // Manual GitHub Sync trigger
    async function triggerGitHubSync() {
      const btn = event?.currentTarget;
      const originalText = btn ? btn.innerHTML : '';
      if (btn) {
        btn.innerHTML = '⏳ Synchronisation...';
        btn.disabled = true;
      }
      try {
        const res = await fetch("/api/admin/sync/github", { method: "POST" });
        const data = await res.json();
        if (res.ok && data.success) {
          alert("✅ Synchronisation réussie !\n\n• Dépôt GitHub : " + data.repo + "\n• Branche : " + data.branch + "\n• Articles synchronisés : " + data.count + "\n• Heberjahiz : À jour");
        } else {
          if (data.error && data.error.includes("Token GitHub non configuré")) {
            if (confirm("Le Token GitHub n'est pas encore configuré.\n\nSouhaitez-vous le configurer maintenant ?")) {
              configureGitHubToken();
            }
          } else {
            alert("⚠️ Échec de la synchronisation :\n" + (data.error || "Erreur inconnue"));
          }
        }
      } catch (err) {
        alert("Erreur de connexion : " + err.message);
      } finally {
        if (btn) {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      }
    }

    // Configure GitHub Token
    async function configureGitHubToken() {
      let currentInfo = "";
      try {
        const statusRes = await fetch("/api/admin/config/github");
        const statusData = await statusRes.json();
        if (statusData.configured) {
          currentInfo = " (Un token est déjà configuré)";
        }
      } catch (e) {}

      const token = prompt("Entrez votre Personal Access Token GitHub (Classic ou Fine-grained avec droit 'Contents: Read & Write')" + currentInfo + " :");
      if (!token || !token.trim()) return;

      try {
        const res = await fetch("/api/admin/config/github", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token.trim() })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (data.sync && data.sync.success) {
            alert("✅ Token GitHub validé et enregistré !\nTous les articles ont été immédiatement synchronisés sur GitHub.");
          } else {
            alert("Token enregistré ! (" + (data.sync?.error || "Vérifiez vos droits de dépôt") + ")");
          }
          location.reload();
        } else {
          alert("Erreur : " + (data.error || "Impossible d'enregistrer le token."));
        }
      } catch (err) {
        alert("Erreur : " + err.message);
      }
    }
  </script>
</body>
