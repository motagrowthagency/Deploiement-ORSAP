name: Deploy to Heberjahiz

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Installation des dépendances
        run: npm ci || npm install

      - name: 🔨 Compilation du Frontend (Vite)
        run: npm run build

      - name: 🚀 Déploiement sur Heberjahiz via FTPS (TLS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ftps
          port: 21
          security: loose
          security-options: '{"rejectUnauthorized": false}'
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/data/**
            data/**
            **/config.local.php

