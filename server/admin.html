<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORSAP — Administration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f2f0ec; color: #14171a; }
    .header { background: #14171a; color: #fff; padding: 28px 32px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 22px; font-weight: 800; }
    .header p { margin-top: 6px; font-size: 13px; color: rgba(255,255,255,.6); }
    .count { display: inline-block; background: #d3121a; color: #fff; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 20px; margin-left: 10px; vertical-align: middle; }
    
    .nav-tabs { display: flex; gap: 8px; margin-top: 15px; }
    .tab-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    .tab-btn:hover { background: rgba(255,255,255,0.2); }
    .tab-btn.active { background: #d3121a; }

    .wrap { max-width: 1300px; margin: 0 auto; padding: 24px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d9dbdd; margin-bottom: 30px; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #d9dbdd; font-size: 13.5px; }
    th { background: #14171a; color: #fff; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
    tr:hover td { background: #fef2f2; }
    
    a { color: #d3121a; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .view-link { color: #14171a; font-weight: 600; }
    .view-link:hover { color: #d3121a; }

    .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .04em; }
    .badge.pro { background: #d3121a; color: #fff; }
    .badge.perso { background: #14171a; color: #fff; }
    .msg { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { text-align: center; padding: 60px 20px; color: #6b7480; font-size: 15px; background: #fff; border: 1px solid #d9dbdd; }
    
    .del-btn { background: none; border: 1px solid #d3121a; color: #d3121a; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; border-radius: 3px; }
    .del-btn:hover { background: #d3121a; color: #fff; }

    .edit-btn { background: #14171a; border: 1px solid #14171a; color: #fff; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; margin-left: 6px; border-radius: 3px; }
    .edit-btn:hover { background: #d3121a; border-color: #d3121a; }
    
    .cancel-btn { background: #6b7480; color: #fff; border: none; padding: 8px 16px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; transition: background 0.15s; border-radius: 4px; display: none; }
    .cancel-btn:hover { background: #4b5563; }
    
    /* Blog Form styles */
    .editor-section { background: #fff; border: 1px solid #d9dbdd; padding: 30px; margin-bottom: 30px; }
    .editor-section h2 { font-size: 18px; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; letter-spacing: .04em; border-left: 4px solid #d3121a; padding-left: 10px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
    .form-group input, .form-group textarea { width: 100%; border: 1px solid #d9dbdd; padding: 12px; font-family: inherit; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: #d3121a; }
    .submit-btn { background: #d3121a; color: #fff; border: none; padding: 12px 24px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; transition: background 0.15s; }
    .submit-btn:hover { background: #a10e14; }
    
    .image-preview-container { display: flex; align-items: center; gap: 15px; margin-top: 10px; }
    .preview-img { max-width: 120px; max-height: 120px; object-fit: cover; border: 1px solid #d9dbdd; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>ORSAP — Administration</h1>
      <p>Panneau de gestion du site internet</p>
      <div class="nav-tabs">
        <a href="/admin?tab=devis" class="tab-btn {{TAB_DEVIS_ACTIVE}}">Demandes de devis ({{SUBMISSIONS_COUNT}})</a>
        <a href="/admin?tab=recrutement" class="tab-btn {{TAB_RECRUTEMENT_ACTIVE}}">Recrutement ({{APPLICATIONS_COUNT}})</a>
        <a href="/admin?tab=blog" class="tab-btn {{TAB_BLOG_ACTIVE}}">Gestion du Blog ({{BLOGS_COUNT}})</a>
      </div>
    </div>
    <div>
      <a href="/admin/logout" class="tab-btn" style="background: rgba(211, 18, 26, 0.2); border: 1px solid #d3121a; color: #fff; padding: 8px 16px; border-radius: 4px; font-size: 12.5px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.04em;">Déconnexion</a>
    </div>
  </div>

  {{TAB_CONTENT}}

  <script>
    // Blog State
    let base64Image = null;
    let base64Pdf = null;
    let pdfFileName = null;
    let editingBlogId = null;
    
    function previewPdf(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      pdfFileName = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Pdf = e.target.result;
        const nameEl = document.getElementById("pdfName");
        nameEl.textContent = "📄 " + pdfFileName;
        nameEl.style.display = "block";
        const removeBtn = document.getElementById("removePdfBtn");
        if (removeBtn) removeBtn.style.display = "inline-block";
      };
      reader.readAsDataURL(file);
    }

    function removePdf() {
      base64Pdf = null;
      pdfFileName = null;
      const pdfInput = document.getElementById("blogPdf");
      if (pdfInput) pdfInput.value = "";
      const nameEl = document.getElementById("pdfName");
      if (nameEl) {
        nameEl.style.display = "none";
        nameEl.textContent = "";
      }
      const removeBtn = document.getElementById("removePdfBtn");
      if (removeBtn) removeBtn.style.display = "none";
    }
    
    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result;
        const preview = document.getElementById("imagePreview");
        preview.src = base64Image;
        preview.style.display = "block";
        const removeBtn = document.getElementById("removeImgBtn");
        if (removeBtn) removeBtn.style.display = "inline-block";
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      base64Image = null;
      const imgInput = document.getElementById("blogImage");
      if (imgInput) imgInput.value = "";
      const preview = document.getElementById("imagePreview");
      if (preview) {
        preview.style.display = "none";
        preview.src = "";
      }
      const removeBtn = document.getElementById("removeImgBtn");
      if (removeBtn) removeBtn.style.display = "none";
    }

    // Delete devis
    async function deleteEntry(id) {
      if (!confirm("Supprimer cette demande ?")) return;
      const res = await fetch("/api/devis/" + id, { method: "DELETE" });
      if (res.ok) {
        const row = document.getElementById("row-" + id);
        if (row) row.remove();
        location.reload();
      } else {
        alert("Erreur lors de la suppression.");
      }
    }

    // Delete application
    async function deleteApp(id) {
      if (!confirm("Supprimer cette candidature ?")) return;
      const res = await fetch("/api/recrutement/" + id, { method: "DELETE" });
      if (res.ok) {
        const row = document.getElementById("app-" + id);
        if (row) row.remove();
        location.reload();
      } else {
        alert("Erreur lors de la suppression.");
      }
    }

    // Edit blog post
    async function editBlog(id) {
      try {
        const res = await fetch("/api/blogs/" + id);
        if (!res.ok) throw new Error("Impossible de charger les détails de l'article.");
        const blog = await res.json();

        editingBlogId = blog.id;
        document.getElementById("formTitle").textContent = "Modifier l'article";
        document.getElementById("blogTitle").value = blog.title || "";
        document.getElementById("blogSummary").value = blog.summary || "";
        document.getElementById("blogContent").value = blog.content || "";

        // Image state
        base64Image = blog.image || null;
        const preview = document.getElementById("imagePreview");
        const removeImgBtn = document.getElementById("removeImgBtn");
        if (blog.image) {
          preview.src = blog.image;
          preview.style.display = "block";
          if (removeImgBtn) removeImgBtn.style.display = "inline-block";
        } else {
          preview.style.display = "none";
          preview.src = "";
          if (removeImgBtn) removeImgBtn.style.display = "none";
        }

        // PDF state
        base64Pdf = blog.pdf || null;
        pdfFileName = blog.pdfName || null;
        const pdfEl = document.getElementById("pdfName");
        const removePdfBtn = document.getElementById("removePdfBtn");
        if (blog.pdf || blog.pdfName) {
          pdfEl.textContent = "📄 " + (blog.pdfName || "Document joint existant");
          pdfEl.style.display = "block";
          if (removePdfBtn) removePdfBtn.style.display = "inline-block";
        } else {
          pdfEl.style.display = "none";
          pdfEl.textContent = "";
          if (removePdfBtn) removePdfBtn.style.display = "none";
        }

        document.getElementById("submitBtn").textContent = "Enregistrer les modifications";
        document.getElementById("cancelBtn").style.display = "inline-block";

        const section = document.querySelector(".editor-section");
        if (section) section.scrollIntoView({ behavior: "smooth" });
      } catch (err) {
        alert(err.message || "Erreur lors du chargement de l'article.");
      }
    }

    // Cancel edit mode
    function cancelEdit() {
      editingBlogId = null;
      document.getElementById("formTitle").textContent = "Rédiger un article de blog";
      document.getElementById("blogForm").reset();
      base64Image = null;
      base64Pdf = null;
      pdfFileName = null;
      const preview = document.getElementById("imagePreview");
      if (preview) { preview.style.display = "none"; preview.src = ""; }
      const pdfEl = document.getElementById("pdfName");
      if (pdfEl) { pdfEl.style.display = "none"; pdfEl.textContent = ""; }
      const removeImgBtn = document.getElementById("removeImgBtn");
      if (removeImgBtn) removeImgBtn.style.display = "none";
      const removePdfBtn = document.getElementById("removePdfBtn");
      if (removePdfBtn) removePdfBtn.style.display = "none";
      document.getElementById("submitBtn").textContent = "Publier l'article";
      document.getElementById("cancelBtn").style.display = "none";
    }

    // Create or Update blog
    async function handleBlogSubmit(event) {
      event.preventDefault();
      const title = document.getElementById("blogTitle").value;
      const summary = document.getElementById("blogSummary").value;
      const content = document.getElementById("blogContent").value;

      const url = editingBlogId ? "/api/blogs/" + editingBlogId : "/api/blogs";
      const method = editingBlogId ? "PUT" : "POST";

      const res = await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title,
          summary,
          content,
          image: base64Image,
          pdf: base64Pdf,
          pdfName: pdfFileName
        })
      });

      if (res.ok) {
        alert(editingBlogId ? "Article modifié avec succès !" : "Article publié avec succès !");
        location.reload();
      } else {
        const data = await res.json();
        alert(data.error || "Erreur lors de l'enregistrement.");
      }
    }

    const createBlog = handleBlogSubmit;

    // Delete blog
    async function deleteBlog(id) {
      if (!confirm("Supprimer cet article de blog définitivement ?")) return;
      const res = await fetch("/api/blogs/" + id, { method: "DELETE" });
      if (res.ok) {
        const row = document.getElementById("blog-" + id);
        if (row) row.remove();
        location.reload();
      } else {
        alert("Erreur lors de la suppression.");
      }
    }
  </script>
</body>
</html>
